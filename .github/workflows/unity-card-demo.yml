name: Unity Card Demo checks

on:
  push:
    paths:
      - 'UnityCard_demo/**'
      - '.github/workflows/unity-card-demo.yml'
  pull_request:
    paths:
      - 'UnityCard_demo/**'
      - '.github/workflows/unity-card-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check committed assets, metadata and config
        run: node UnityCard_demo/Tools/check-project.mjs
      - name: Compile and run pure C# rules (not a Unity editor build)
        run: dotnet run --project UnityCard_demo/Tools/CoreSmokeTests/CoreSmokeTests.csproj --configuration Release
