<!DOCTYPE html>
<html>
<head>
    <title>游戏测试</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .ok { background: #90EE90; }
        .error { background: #FFB6C6; }
    </style>
</head>
<body>
    <h1>游戏代码检查</h1>
    
    <h2>代码片段测试</h2>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function test(name, fn) {
            try {
                fn();
                results.innerHTML += `<div class="status ok">✓ ${name}</div>`;
            } catch (e) {
                results.innerHTML += `<div class="status error">✗ ${name}: ${e.message}</div>`;
            }
        }
        
        // 测试 1: coreIsPveChallenge 函数
        test('coreIsPveChallenge 函数存在', () => {
            const code = `
                function coreIsPveChallenge(modeOrGame) {
                    const mode = typeof modeOrGame === "string" ? modeOrGame : modeOrGame?.mode;
                    return mode === "pve-challenge";
                }
            `;
            eval(code);
            if (coreIsPveChallenge("pve-challenge") !== true) throw new Error('应返回 true');
            if (coreIsPveChallenge("pve") !== false) throw new Error('应返回 false');
        });
        
        // 测试 2: CARD_DRAWN 事件处理逻辑
        test('CARD_DRAWN 事件检查', () => {
            const code = `
                const CORE_V2_EVENT = { CARD_DRAWN: "cardDrawn" };
                const game = { currentPhase: "行动阶段", mode: "pve-challenge" };
                const event = "cardDrawn";
                
                // 模拟事件处理
                if (event === CORE_V2_EVENT.CARD_DRAWN) {
                    // if (coreIsPveChallenge(game) && game.currentPhase !== "开局展示") {
                    //   coreTrimEliteAiHand(game);  
                    // }
                    if (typeof game === 'object' && game.mode === 'pve-challenge') {
                        // 这是正确的路径
                    } else {
                        throw new Error('模式检查失败');
                    }
                }
            `;
            eval(code);
        });
        
        // 测试 3: PVE vs PVE挑战检查
        test('PVE 和 PVE挑战模式区分', () => {
            const modes = [
                { mode: 'pve', isPveChallenge: false, isPve: true },
                { mode: 'pve-challenge', isPveChallenge: true, isPve: true },
                { mode: 'pvp', isPveChallenge: false, isPve: false }
            ];
            
            modes.forEach(m => {
                const isPveChallenge = m.mode === 'pve-challenge';
                if (isPveChallenge !== m.isPveChallenge) throw new Error(`模式 ${m.mode} 检查失败`);
            });
        });
        
        results.innerHTML += '<h2>结论</h2>';
        results.innerHTML += '<p>代码逻辑检查完成。问题排查建议：</p>';
        results.innerHTML += '<ol>';
        results.innerHTML += '<li>清空浏览器缓存并 Hard Refresh (Ctrl+Shift+R)</li>';
        results.innerHTML += '<li>检查 Railway 是否已完成部署（可能需要 2-3 分钟）</li>';
        results.innerHTML += '<li>在浏览器开发工具 Console 中检查是否有 JavaScript 错误</li>';
        results.innerHTML += '<li>检查 Network 标签页确认 core-v2.js 是否加载正确的版本</li>';
        results.innerHTML += '</ol>';
    </script>
</body>
</html>
